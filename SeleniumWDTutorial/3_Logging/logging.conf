; This section lists the loggers used by the app
[loggers]
keys=root,LoggerDemoConfiguration

; This section lists the handlers that can output log messages
[handlers]
keys=fileHandler,consoleHandler

; This section lists the available formatters
[formatters]
keys=simpleFormatter

; Root logger configuration
[logger_root]
level=DEBUG
handlers=fileHandler,consoleHandler

; Custom logger for the demo class
[logger_LoggerDemoConfiguration]
level=DEBUG
handlers=fileHandler,consoleHandler
qualname=LoggerDemoConfiguration
propagate=0

; Writes log messages to a file
[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=simpleFormatter
args=('%(log_file)s',)

; Prints log messages to the console
[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

; Simple format for the log output
[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%d-%m-%Y %H:%M:%S

